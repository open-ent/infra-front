name: Build & Publish npm package

on:
  push:
    tags: ['*-patched']
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build & Publish (Nexus npm-passtech)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v4
        with:
          version: 10

      # package.json n'est jamais commité (gitignoré) : il est généré depuis
      # package.json.template par build.sh:init() en dev (placeholders %branch%/
      # %generateVersion%). Pour un tag -patched, on fixe la version directement
      # sur le nom du tag (release immuable), pas de suffixe timestamp de dev.
      - name: Générer package.json depuis le template
        run: |
          TAG="${GITHUB_REF_NAME}"
          cp package.json.template package.json
          sed -i "s/%generateVersion%//" package.json
          sed -i "s/%branch%\.//" package.json
          npm pkg set version="${TAG}"
          echo "Version publiée : ${TAG}"

      # yarn (pas pnpm) : node_modules à plat, requis par gulpfile.js qui fait
      # require('glob') sans le déclarer en dépendance directe (dépendance
      # fantôme incompatible avec la résolution stricte de pnpm). build.sh:init()
      # utilise yarn install pour cette même raison.
      - name: Install dependencies (yarn)
        run: yarn install

      - name: Build (gulp release:build)
        run: pnpm run release:build

      - name: Configure npm pour Nexus (npm-passtech)
        env:
          NEXUS_USER: ${{ secrets.NEXUS_USER }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          AUTH=$(printf '%s:%s' "$NEXUS_USER" "$NEXUS_PASSWORD" | base64 -w0)
          cat > ~/.npmrc << EOF
          registry=https://rct-nexus.tech.fr/repository/npm-passtech/
          //rct-nexus.tech.fr/repository/npm-passtech/:_auth=${AUTH}
          //rct-nexus.tech.fr/repository/npm-passtech/:always-auth=true
          EOF

      - name: Publish to Nexus npm-passtech
        run: npm publish --registry=https://rct-nexus.tech.fr/repository/npm-passtech/
